spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hqzp_recruit}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin123
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# AI module
deepseek:
  api-key: ${DEEPSEEK_API_KEY:your-deepseek-api-key}
  base-url: https://api.deepseek.com
  model: deepseek-chat
  timeout-seconds: 60
  max-tokens: 4096

# File module
file:
  s3:
    endpoint: ${S3_ENDPOINT:https://s3.amazonaws.com}
    access-key: ${S3_ACCESS_KEY:your-access-key}
    secret-key: ${S3_SECRET_KEY:your-secret-key}
    bucket: ${S3_BUCKET:hqzp-recruit}
    region: ${S3_REGION:us-east-1}
    public-base-url: ${S3_PUBLIC_BASE_URL:https://hqzp-recruit.s3.amazonaws.com}
  allowed-types: image/jpeg,image/png,image/gif,image/webp,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document
  max-size-mb: 20
