<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(content=~{::main-fragment}, scriptExtra=~{::script-fragment})}">
<head><title>职位列表</title></head>
<body>

<th:block th:fragment="main-fragment">
    <div id="job-list-app" class="page-container">
        <!-- Filter bar -->
        <div class="filter-bar">
            <el-input v-model="query.keyword" placeholder="搜索职位、公司" clearable
                      style="width:300px" @change="search"/>
            <el-select v-model="query.city" placeholder="城市" clearable style="width:130px" @change="search">
                <el-option v-for="c in cities" :key="c" :label="c" :value="c"/>
            </el-select>
            <el-select v-model="query.category" placeholder="职位类别" clearable style="width:140px" @change="search">
                <el-option v-for="c in categories" :key="c" :label="c" :value="c"/>
            </el-select>
            <el-select v-model="query.experience" placeholder="工作经验" clearable style="width:130px" @change="search">
                <el-option v-for="e in experiences" :key="e" :label="e" :value="e"/>
            </el-select>
            <el-select v-model="query.education" placeholder="学历要求" clearable style="width:120px" @change="search">
                <el-option v-for="e in educations" :key="e" :label="e" :value="e"/>
            </el-select>
            <el-button type="primary" @click="search">搜索</el-button>
            <el-button @click="reset">重置</el-button>
        </div>

        <!-- Results -->
        <div class="result-info" v-if="!loading">
            共找到 <strong>{{ total }}</strong> 个职位
        </div>

        <div v-if="loading" class="loading-wrap">
            <el-skeleton :rows="5" animated/>
        </div>

        <div v-else>
            <div v-if="jobs.length === 0" class="empty-state">
                <el-empty description="暂无符合条件的职位"/>
            </div>
            <div v-else class="job-list">
                <div v-for="job in jobs" :key="job.id" class="job-list-item"
                     @click="goToJob(job.id)">
                    <div class="job-list-left">
                        <div class="job-list-title">{{ job.title }}</div>
                        <div class="job-list-meta">
                            <span>{{ job.city }}</span>
                            <span>{{ job.experience || '经验不限' }}</span>
                            <span>{{ job.education || '学历不限' }}</span>
                        </div>
                    </div>
                    <div class="job-list-center">
                        <img :src="job.companyLogo || '/images/default-company.png'"
                             class="company-logo-sm" alt=""/>
                        <div>
                            <div class="company-name-text">{{ job.companyName }}</div>
                            <div class="company-meta-text">{{ job.companyIndustry }}</div>
                        </div>
                    </div>
                    <div class="job-list-right">
                        <div class="salary-text">{{ formatSalary(job.salaryMin, job.salaryMax) }}</div>
                        <div class="post-time">{{ formatDate(job.createTime) }}</div>
                    </div>
                </div>
            </div>

            <div class="pagination-wrap">
                <el-pagination
                    v-model:current-page="query.current"
                    v-model:page-size="query.size"
                    :total="total"
                    :page-sizes="[10, 20, 50]"
                    layout="total, sizes, prev, pager, next"
                    @size-change="search"
                    @current-change="search"/>
            </div>
        </div>
    </div>
</th:block>

<th:block th:fragment="script-fragment">
<script>
const { createApp, ref, reactive, onMounted } = Vue;
createApp({
    setup() {
        const loading = ref(false);
        const jobs = ref([]);
        const total = ref(0);
        const cities = ['北京','上海','广州','深圳','杭州','成都','武汉','南京','西安','重庆'];
        const categories = ['技术','产品','设计','运营','市场','销售','财务','人事','行政','其他'];
        const experiences = ['不限','1年以下','1-3年','3-5年','5-10年','10年以上'];
        const educations = ['不限','大专','本科','硕士','博士'];

        const urlParams = new URLSearchParams(location.search);
        const query = reactive({
            keyword: urlParams.get('keyword') || '',
            city: urlParams.get('city') || '',
            category: '', experience: '', education: '',
            current: 1, size: 10, status: 1
        });

        const search = () => {
            loading.value = true;
            window.RecruitApi.getJobs(query).then(res => {
                jobs.value = res.data?.records || [];
                total.value = res.data?.total || 0;
                loading.value = false;
            }).catch(() => { loading.value = false; });
        };

        const reset = () => {
            Object.assign(query, { keyword:'', city:'', category:'', experience:'', education:'', current:1 });
            search();
        };

        const goToJob = (id) => window.location.href = `/jobs/${id}`;
        const formatSalary = (min, max) => {
            if (!min && !max) return '薪资面议';
            const fmt = v => v >= 10000 ? (v/1000).toFixed(0)+'K' : v+'元';
            return fmt(min) + '-' + fmt(max) + '/月';
        };
        const formatDate = (dt) => dt ? dt.substring(0, 10) : '';

        onMounted(search);
        return { loading, jobs, total, query, cities, categories, experiences, educations,
                 search, reset, goToJob, formatSalary, formatDate };
    }
}).use(ElementPlus).mount('#job-list-app');
</script>
</th:block>

</body>
</html>
