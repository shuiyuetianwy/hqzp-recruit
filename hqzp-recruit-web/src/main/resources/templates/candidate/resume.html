<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(content=~{::main-fragment}, scriptExtra=~{::script-fragment})}">
<head><title>我的简历</title></head>
<body>

<th:block th:fragment="main-fragment">
    <div id="resume-app" class="page-container">
        <div class="page-header">
            <h2>我的简历</h2>
            <div>
                <el-button @click="aiAnalyse" :loading="aiLoading" type="success" plain>AI分析简历</el-button>
                <el-button type="primary" @click="save" :loading="saving">保存简历</el-button>
            </div>
        </div>

        <el-form :model="form" ref="formRef" label-width="100px" v-loading="loading">
            <!-- Basic info -->
            <el-card class="form-card">
                <template #header><span>基本信息</span></template>
                <el-row :gutter="20">
                    <el-col :span="8">
                        <el-form-item label="真实姓名" prop="realName" :rules="[{required:true,message:'请输入姓名'}]">
                            <el-input v-model="form.realName"/>
                        </el-form-item>
                    </el-col>
                    <el-col :span="8">
                        <el-form-item label="性别">
                            <el-radio-group v-model="form.gender">
                                <el-radio :label="1">男</el-radio>
                                <el-radio :label="2">女</el-radio>
                            </el-radio-group>
                        </el-form-item>
                    </el-col>
                    <el-col :span="8">
                        <el-form-item label="年龄">
                            <el-input-number v-model="form.age" :min="16" :max="70" style="width:100%"/>
                        </el-form-item>
                    </el-col>
                    <el-col :span="8">
                        <el-form-item label="手机号">
                            <el-input v-model="form.phone"/>
                        </el-form-item>
                    </el-col>
                    <el-col :span="8">
                        <el-form-item label="邮箱">
                            <el-input v-model="form.email"/>
                        </el-form-item>
                    </el-col>
                    <el-col :span="8">
                        <el-form-item label="所在城市">
                            <el-input v-model="form.city"/>
                        </el-form-item>
                    </el-col>
                    <el-col :span="8">
                        <el-form-item label="当前职位">
                            <el-input v-model="form.currentTitle"/>
                        </el-form-item>
                    </el-col>
                    <el-col :span="8">
                        <el-form-item label="工作年限">
                            <el-input-number v-model="form.experienceYears" :min="0" :max="50" style="width:100%"/>
                        </el-form-item>
                    </el-col>
                    <el-col :span="8">
                        <el-form-item label="最高学历">
                            <el-select v-model="form.education" style="width:100%">
                                <el-option v-for="e in educations" :key="e" :label="e" :value="e"/>
                            </el-select>
                        </el-form-item>
                    </el-col>
                    <el-col :span="24">
                        <el-form-item label="自我介绍">
                            <el-input v-model="form.summary" type="textarea" :rows="4"
                                      placeholder="简要介绍自己的优势和求职意向"/>
                        </el-form-item>
                    </el-col>
                </el-row>
            </el-card>

            <!-- Work experience -->
            <el-card class="form-card">
                <template #header>
                    <div class="card-header-row">
                        <span>工作经历</span>
                        <el-button size="small" @click="addWorkExp">+ 添加</el-button>
                    </div>
                </template>
                <div v-for="(exp, idx) in form.workExps" :key="idx" class="exp-item">
                    <el-row :gutter="20">
                        <el-col :span="8"><el-form-item label="公司名称">
                            <el-input v-model="exp.companyName"/>
                        </el-form-item></el-col>
                        <el-col :span="8"><el-form-item label="职位名称">
                            <el-input v-model="exp.jobTitle"/>
                        </el-form-item></el-col>
                        <el-col :span="4"><el-form-item label="开始时间">
                            <el-input v-model="exp.startDate" placeholder="2020-01"/>
                        </el-form-item></el-col>
                        <el-col :span="4"><el-form-item label="结束时间">
                            <el-input v-model="exp.endDate" placeholder="2023-06" :disabled="exp.isCurrent"/>
                        </el-form-item></el-col>
                        <el-col :span="4"><el-form-item label="在职">
                            <el-switch v-model="exp.isCurrent"/>
                        </el-form-item></el-col>
                        <el-col :span="20"><el-form-item label="工作描述">
                            <el-input v-model="exp.description" type="textarea" :rows="3"/>
                        </el-form-item></el-col>
                        <el-col :span="4" style="display:flex;align-items:center">
                            <el-button type="danger" plain size="small" @click="removeWorkExp(idx)">删除</el-button>
                        </el-col>
                    </el-row>
                    <el-divider v-if="idx < form.workExps.length - 1"/>
                </div>
                <el-empty v-if="form.workExps.length === 0" description="暂无工作经历" :image-size="60"/>
            </el-card>

            <!-- Education experience -->
            <el-card class="form-card">
                <template #header>
                    <div class="card-header-row">
                        <span>教育经历</span>
                        <el-button size="small" @click="addEduExp">+ 添加</el-button>
                    </div>
                </template>
                <div v-for="(exp, idx) in form.eduExps" :key="idx" class="exp-item">
                    <el-row :gutter="20">
                        <el-col :span="6"><el-form-item label="学校名称">
                            <el-input v-model="exp.schoolName"/>
                        </el-form-item></el-col>
                        <el-col :span="6"><el-form-item label="专业">
                            <el-input v-model="exp.major"/>
                        </el-form-item></el-col>
                        <el-col :span="4"><el-form-item label="学历">
                            <el-select v-model="exp.degree" style="width:100%">
                                <el-option v-for="e in educations" :key="e" :label="e" :value="e"/>
                            </el-select>
                        </el-form-item></el-col>
                        <el-col :span="4"><el-form-item label="开始时间">
                            <el-input v-model="exp.startDate" placeholder="2016-09"/>
                        </el-form-item></el-col>
                        <el-col :span="4"><el-form-item label="结束时间">
                            <el-input v-model="exp.endDate" placeholder="2020-06"/>
                        </el-form-item></el-col>
                        <el-col :span="4" style="display:flex;align-items:center">
                            <el-button type="danger" plain size="small" @click="removeEduExp(idx)">删除</el-button>
                        </el-col>
                    </el-row>
                    <el-divider v-if="idx < form.eduExps.length - 1"/>
                </div>
                <el-empty v-if="form.eduExps.length === 0" description="暂无教育经历" :image-size="60"/>
            </el-card>
        </el-form>

        <!-- AI analysis result -->
        <el-dialog v-model="aiDialogVisible" title="AI简历分析" width="700px">
            <div v-if="aiLoading" style="text-align:center;padding:40px">
                <el-icon class="is-loading" size="40"><Loading/></el-icon>
                <p>AI正在分析中，请稍候...</p>
            </div>
            <div v-else-if="aiResult">
                <div class="ai-score-row">
                    <span>综合评分</span>
                    <el-progress type="circle" :percentage="aiResult.score" :width="80"/>
                </div>
                <el-tabs>
                    <el-tab-pane label="优势亮点">
                        <ul><li v-for="s in aiResult.strengths" :key="s">{{ s }}</li></ul>
                    </el-tab-pane>
                    <el-tab-pane label="不足之处">
                        <ul><li v-for="w in aiResult.weaknesses" :key="w">{{ w }}</li></ul>
                    </el-tab-pane>
                    <el-tab-pane label="改进建议">
                        <ul><li v-for="s in aiResult.suggestions" :key="s">{{ s }}</li></ul>
                    </el-tab-pane>
                </el-tabs>
                <el-alert :title="aiResult.summary" type="info" :closable="false" style="margin-top:12px"/>
            </div>
        </el-dialog>
    </div>
</th:block>

<th:block th:fragment="script-fragment">
<script>
const { createApp, ref, reactive, onMounted } = Vue;
createApp({
    setup() {
        const formRef = ref(null);
        const loading = ref(true);
        const saving = ref(false);
        const aiLoading = ref(false);
        const aiDialogVisible = ref(false);
        const aiResult = ref(null);
        const educations = ['大专','本科','硕士','博士'];
        const resumeId = ref(null);

        const form = reactive({
            realName:'', gender:1, age:null, phone:'', email:'', city:'',
            currentTitle:'', experienceYears:0, education:'本科', summary:'',
            visibility:1, workExps:[], eduExps:[]
        });

        const addWorkExp = () => form.workExps.push({ companyName:'', jobTitle:'', startDate:'', endDate:'', isCurrent:false, description:'' });
        const removeWorkExp = (i) => form.workExps.splice(i, 1);
        const addEduExp = () => form.eduExps.push({ schoolName:'', major:'', degree:'本科', startDate:'', endDate:'' });
        const removeEduExp = (i) => form.eduExps.splice(i, 1);

        const save = () => {
            saving.value = true;
            const payload = { ...form, id: resumeId.value };
            window.RecruitApi.saveResume(payload)
                .then(res => {
                    resumeId.value = res.data;
                    ElementPlus.ElMessage.success('保存成功');
                })
                .catch(err => ElementPlus.ElMessage.error(err.response?.data?.message || '保存失败'))
                .finally(() => { saving.value = false; });
        };

        const aiAnalyse = () => {
            if (!resumeId.value) {
                ElementPlus.ElMessage.warning('请先保存简历');
                return;
            }
            aiDialogVisible.value = true;
            aiLoading.value = true;
            aiResult.value = null;
            window.RecruitApi.aiAnalyseResume(resumeId.value)
                .then(res => {
                    try { aiResult.value = JSON.parse(res.data.content); }
                    catch(e) { aiResult.value = { score:0, strengths:[], weaknesses:[], suggestions:[], summary: res.data.content }; }
                })
                .catch(() => ElementPlus.ElMessage.error('AI分析失败'))
                .finally(() => { aiLoading.value = false; });
        };

        onMounted(() => {
            window.RecruitApi.getMyResume().then(res => {
                if (res.data) {
                    const r = res.data;
                    resumeId.value = r.id;
                    Object.assign(form, {
                        realName: r.realName || '', gender: r.gender || 1, age: r.age,
                        phone: r.phone || '', email: r.email || '', city: r.city || '',
                        currentTitle: r.currentTitle || '', experienceYears: r.experienceYears || 0,
                        education: r.education || '本科', summary: r.summary || '',
                        visibility: r.visibility ?? 1,
                        workExps: r.workExps || [], eduExps: r.eduExps || []
                    });
                }
                loading.value = false;
            }).catch(() => { loading.value = false; });
        });

        return { formRef, form, loading, saving, aiLoading, aiDialogVisible, aiResult,
                 educations, addWorkExp, removeWorkExp, addEduExp, removeEduExp, save, aiAnalyse };
    }
}).use(ElementPlus).mount('#resume-app');
</script>
</th:block>

</body>
</html>
