<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(content=~{::main-fragment}, scriptExtra=~{::script-fragment})}">
<head><title>企业列表</title></head>
<body>
<th:block th:fragment="main-fragment">
    <div id="company-list-app" class="page-container">
        <div class="page-header"><h2>企业列表</h2></div>
        <div class="filter-bar">
            <el-input v-model="query.keyword" placeholder="搜索企业名称" clearable style="width:260px" @change="load"/>
            <el-select v-model="query.industry" placeholder="行业" clearable style="width:140px" @change="load">
                <el-option v-for="i in industries" :key="i" :label="i" :value="i"/>
            </el-select>
        </div>
        <div v-if="loading"><el-skeleton :rows="4" animated/></div>
        <div v-else class="company-grid">
            <div v-for="c in companies" :key="c.id" class="company-card" @click="() => location.href=`/companies/${c.id}`">
                <img :src="c.logo||'/images/default-company.png'" class="company-logo" alt=""/>
                <div class="company-name">{{ c.name }}</div>
                <div class="company-meta">{{ c.industry }} · {{ scaleLabel(c.scale) }}</div>
                <div class="company-city">{{ c.city }}</div>
            </div>
        </div>
        <div class="pagination-wrap">
            <el-pagination v-model:current-page="query.current" :total="total"
                           layout="total, prev, pager, next" @current-change="load"/>
        </div>
    </div>
</th:block>
<th:block th:fragment="script-fragment">
<script>
const { createApp, ref, reactive, onMounted } = Vue;
createApp({
    setup() {
        const loading = ref(false);
        const companies = ref([]);
        const total = ref(0);
        const query = reactive({ keyword:'', industry:'', current:1, size:12 });
        const industries = ['互联网','金融','教育','医疗','制造','零售','物流','房地产','其他'];
        const scaleLabel = (s) => (['','<20人','20-99人','100-499人','500-999人','1000+人'][s]||'');
        const load = () => {
            loading.value = true;
            window.RecruitApi.getCompanies(query).then(res => {
                companies.value = res.data?.records || [];
                total.value = res.data?.total || 0;
                loading.value = false;
            }).catch(() => { loading.value = false; });
        };
        onMounted(load);
        return { loading, companies, total, query, industries, scaleLabel, load };
    }
}).use(ElementPlus).mount('#company-list-app');
</script>
</th:block>
</body>
</html>
