<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(content=~{::main-fragment}, scriptExtra=~{::script-fragment})}">
<head><title>职位表单</title></head>
<body>

<th:block th:fragment="main-fragment">
    <div id="job-form-app" class="page-container">
        <div class="page-header">
            <h2 th:text="${jobId} ? '编辑职位' : '发布职位'">职位表单</h2>
            <el-button @click="() => location.href='/hr/jobs'">返回列表</el-button>
        </div>

        <el-form :model="form" :rules="rules" ref="formRef" label-width="110px" v-loading="loading">
            <el-card class="form-card">
                <template #header><span>基本信息</span></template>
                <el-row :gutter="20">
                    <el-col :span="12">
                        <el-form-item label="职位名称" prop="title">
                            <el-input v-model="form.title" placeholder="请输入职位名称"/>
                        </el-form-item>
                    </el-col>
                    <el-col :span="12">
                        <el-form-item label="职位类别" prop="category">
                            <el-select v-model="form.category" style="width:100%">
                                <el-option v-for="c in categories" :key="c" :label="c" :value="c"/>
                            </el-select>
                        </el-form-item>
                    </el-col>
                    <el-col :span="8">
                        <el-form-item label="工作城市" prop="city">
                            <el-input v-model="form.city"/>
                        </el-form-item>
                    </el-col>
                    <el-col :span="16">
                        <el-form-item label="详细地址">
                            <el-input v-model="form.address"/>
                        </el-form-item>
                    </el-col>
                    <el-col :span="6">
                        <el-form-item label="薪资下限(元)" prop="salaryMin">
                            <el-input-number v-model="form.salaryMin" :min="0" style="width:100%"/>
                        </el-form-item>
                    </el-col>
                    <el-col :span="6">
                        <el-form-item label="薪资上限(元)" prop="salaryMax">
                            <el-input-number v-model="form.salaryMax" :min="0" style="width:100%"/>
                        </el-form-item>
                    </el-col>
                    <el-col :span="6">
                        <el-form-item label="工作经验">
                            <el-select v-model="form.experience" style="width:100%">
                                <el-option v-for="e in experiences" :key="e" :label="e" :value="e"/>
                            </el-select>
                        </el-form-item>
                    </el-col>
                    <el-col :span="6">
                        <el-form-item label="学历要求">
                            <el-select v-model="form.education" style="width:100%">
                                <el-option v-for="e in educations" :key="e" :label="e" :value="e"/>
                            </el-select>
                        </el-form-item>
                    </el-col>
                    <el-col :span="6">
                        <el-form-item label="招聘人数">
                            <el-input-number v-model="form.headcount" :min="1" style="width:100%"/>
                        </el-form-item>
                    </el-col>
                    <el-col :span="6">
                        <el-form-item label="工作类型">
                            <el-select v-model="form.jobType" style="width:100%">
                                <el-option label="全职" :value="1"/>
                                <el-option label="兼职" :value="2"/>
                                <el-option label="实习" :value="3"/>
                            </el-select>
                        </el-form-item>
                    </el-col>
                </el-row>
            </el-card>

            <el-card class="form-card">
                <template #header><span>职位详情</span></template>
                <el-form-item label="职位描述" prop="description">
                    <el-input v-model="form.description" type="textarea" :rows="8"
                              placeholder="请详细描述职位职责、工作内容等"/>
                </el-form-item>
                <el-form-item label="任职要求">
                    <el-input v-model="form.requirement" type="textarea" :rows="6"
                              placeholder="请描述任职要求、技能要求等"/>
                </el-form-item>
            </el-card>

            <div class="form-actions">
                <el-button @click="saveDraft" :loading="saving">保存草稿</el-button>
                <el-button type="primary" @click="saveAndPublish" :loading="saving">保存并发布</el-button>
            </div>
        </el-form>
    </div>
</th:block>

<th:block th:fragment="script-fragment">
<script th:inline="javascript">
const jobId = /*[[${jobId}]]*/ null;
const { createApp, ref, reactive, onMounted } = Vue;
createApp({
    setup() {
        const formRef = ref(null);
        const loading = ref(false);
        const saving = ref(false);
        const categories = ['技术','产品','设计','运营','市场','销售','财务','人事','行政','其他'];
        const experiences = ['不限','1年以下','1-3年','3-5年','5-10年','10年以上'];
        const educations = ['不限','大专','本科','硕士','博士'];

        const form = reactive({
            title:'', category:'技术', city:'', address:'',
            salaryMin:null, salaryMax:null, experience:'不限', education:'不限',
            headcount:1, jobType:1, description:'', requirement:''
        });

        const rules = {
            title: [{ required:true, message:'请输入职位名称', trigger:'blur' }],
            city:  [{ required:true, message:'请输入工作城市', trigger:'blur' }],
            salaryMin: [{ required:true, message:'请输入薪资下限', trigger:'blur' }],
            salaryMax: [{ required:true, message:'请输入薪资上限', trigger:'blur' }],
            description: [{ required:true, message:'请输入职位描述', trigger:'blur' }]
        };

        const doSave = (publish) => {
            return new Promise((resolve, reject) => {
                formRef.value.validate(valid => {
                    if (!valid) return reject();
                    saving.value = true;
                    const api = jobId
                        ? window.RecruitApi.updateJob(jobId, form)
                        : window.RecruitApi.createJob(form);
                    api.then(res => {
                        const id = jobId || res.data;
                        if (publish) {
                            return window.RecruitApi.publishJob(id).then(() => resolve(id));
                        }
                        resolve(id);
                    }).catch(err => {
                        ElementPlus.ElMessage.error(err.response?.data?.message || '保存失败');
                        reject();
                    }).finally(() => { saving.value = false; });
                });
            });
        };

        const saveDraft = () => doSave(false).then(() => {
            ElementPlus.ElMessage.success('草稿已保存');
            setTimeout(() => location.href = '/hr/jobs', 800);
        }).catch(() => {});

        const saveAndPublish = () => doSave(true).then(() => {
            ElementPlus.ElMessage.success('职位已发布');
            setTimeout(() => location.href = '/hr/jobs', 800);
        }).catch(() => {});

        onMounted(() => {
            if (jobId) {
                loading.value = true;
                window.RecruitApi.getJobDetail(jobId).then(res => {
                    const j = res.data;
                    Object.assign(form, {
                        title: j.title, category: j.category, city: j.city, address: j.address,
                        salaryMin: j.salaryMin, salaryMax: j.salaryMax, experience: j.experience,
                        education: j.education, headcount: j.headcount, jobType: j.jobType,
                        description: j.description, requirement: j.requirement
                    });
                    loading.value = false;
                });
            }
        });

        return { formRef, form, rules, loading, saving, categories, experiences, educations,
                 saveDraft, saveAndPublish };
    }
}).use(ElementPlus).mount('#job-form-app');
</script>
</th:block>

</body>
</html>
