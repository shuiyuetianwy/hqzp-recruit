<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(content=~{::main-fragment}, scriptExtra=~{::script-fragment})}">
<head><title>注册</title></head>
<body>

<th:block th:fragment="main-fragment">
    <div class="auth-page">
        <div id="register-app" class="auth-card">
            <h2 class="auth-title" th:text="${userType == 2} ? 'HR注册' : '求职者注册'">注册</h2>
            <el-form :model="form" :rules="rules" ref="formRef" label-position="top">
                <el-form-item label="用户名" prop="username">
                    <el-input v-model="form.username" placeholder="4-20位字母、数字、下划线" size="large"/>
                </el-form-item>
                <el-form-item label="手机号" prop="phone">
                    <el-input v-model="form.phone" placeholder="请输入手机号" size="large"/>
                </el-form-item>
                <el-form-item label="昵称" prop="nickname">
                    <el-input v-model="form.nickname" placeholder="请输入昵称" size="large"/>
                </el-form-item>
                <el-form-item label="密码" prop="password">
                    <el-input v-model="form.password" type="password" placeholder="6-20位密码"
                              size="large" show-password/>
                </el-form-item>
                <el-form-item label="确认密码" prop="confirmPassword">
                    <el-input v-model="form.confirmPassword" type="password" placeholder="再次输入密码"
                              size="large" show-password @keyup.enter="submit"/>
                </el-form-item>
                <el-form-item>
                    <el-button type="primary" size="large" style="width:100%" :loading="loading" @click="submit">
                        注 册
                    </el-button>
                </el-form-item>
            </el-form>
            <div class="auth-footer">
                已有账号？<a th:href="@{/login}">立即登录</a>
            </div>
        </div>
    </div>
</th:block>

<th:block th:fragment="script-fragment">
<script th:inline="javascript">
const userType = /*[[${userType}]]*/ 3;
const { createApp, ref, reactive } = Vue;
createApp({
    setup() {
        const formRef = ref(null);
        const loading = ref(false);
        const form = reactive({
            username: '', phone: '', nickname: '', password: '', confirmPassword: '',
            userType: userType
        });
        const validateConfirm = (rule, value, callback) => {
            if (value !== form.password) callback(new Error('两次密码不一致'));
            else callback();
        };
        const rules = {
            username: [
                { required: true, message: '请输入用户名', trigger: 'blur' },
                { pattern: /^[a-zA-Z0-9_]{4,20}$/, message: '4-20位字母、数字、下划线', trigger: 'blur' }
            ],
            phone: [
                { required: true, message: '请输入手机号', trigger: 'blur' },
                { pattern: /^1[3-9]\d{9}$/, message: '手机号格式不正确', trigger: 'blur' }
            ],
            password: [
                { required: true, message: '请输入密码', trigger: 'blur' },
                { min: 6, max: 20, message: '密码长度6-20位', trigger: 'blur' }
            ],
            confirmPassword: [
                { required: true, message: '请确认密码', trigger: 'blur' },
                { validator: validateConfirm, trigger: 'blur' }
            ]
        };
        const submit = () => {
            formRef.value.validate(valid => {
                if (!valid) return;
                loading.value = true;
                const { confirmPassword, ...payload } = form;
                window.RecruitApi.register(payload)
                    .then(() => {
                        ElementPlus.ElMessage.success('注册成功，请登录');
                        setTimeout(() => location.href = '/login', 1000);
                    })
                    .catch(err => {
                        ElementPlus.ElMessage.error(err.response?.data?.message || '注册失败');
                        loading.value = false;
                    });
            });
        };
        return { formRef, form, rules, loading, submit };
    }
}).use(ElementPlus).mount('#register-app');
</script>
</th:block>

</body>
</html>
