<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(content=~{::main-fragment}, scriptExtra=~{::script-fragment})}">
<head><title>登录</title></head>
<body>

<th:block th:fragment="main-fragment">
    <div class="auth-page">
        <div id="login-app" class="auth-card">
            <h2 class="auth-title">登录</h2>
            <el-form :model="form" :rules="rules" ref="formRef" label-position="top">
                <el-form-item label="用户名" prop="username">
                    <el-input v-model="form.username" placeholder="请输入用户名" size="large" prefix-icon="User"/>
                </el-form-item>
                <el-form-item label="密码" prop="password">
                    <el-input v-model="form.password" type="password" placeholder="请输入密码"
                              size="large" prefix-icon="Lock" show-password @keyup.enter="submit"/>
                </el-form-item>
                <el-form-item>
                    <el-button type="primary" size="large" style="width:100%" :loading="loading" @click="submit">
                        登 录
                    </el-button>
                </el-form-item>
            </el-form>
            <div class="auth-footer">
                还没有账号？
                <a th:href="@{/register(type=3)}">求职者注册</a> ·
                <a th:href="@{/register(type=2)}">HR注册</a>
            </div>
        </div>
    </div>
</th:block>

<th:block th:fragment="script-fragment">
<script>
const { createApp, ref, reactive } = Vue;
createApp({
    setup() {
        const formRef = ref(null);
        const loading = ref(false);
        const form = reactive({ username: '', password: '' });
        const rules = {
            username: [{ required: true, message: '请输入用户名', trigger: 'blur' }],
            password: [{ required: true, message: '请输入密码', trigger: 'blur' }]
        };
        const submit = () => {
            formRef.value.validate(valid => {
                if (!valid) return;
                loading.value = true;
                window.RecruitApi.login(form)
                    .then(res => {
                        RecruitUtils.saveToken(res.data.accessToken);
                        RecruitUtils.saveUser(res.data);
                        const redirect = new URLSearchParams(location.search).get('redirect');
                        const userType = res.data.userType;
                        if (redirect) {
                            location.href = redirect;
                        } else if (userType === 2) {
                            location.href = '/hr/dashboard';
                        } else if (userType === 1) {
                            location.href = '/hr/dashboard';
                        } else {
                            location.href = '/candidate/dashboard';
                        }
                    })
                    .catch(err => {
                        ElementPlus.ElMessage.error(err.response?.data?.message || '登录失败');
                        loading.value = false;
                    });
            });
        };
        return { formRef, form, rules, loading, submit };
    }
}).use(ElementPlus).mount('#login-app');
</script>
</th:block>

</body>
</html>
